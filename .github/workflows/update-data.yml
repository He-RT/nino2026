name: Update NOAA OISST Data

on:
  schedule:
    # ~23:30 Beijing Time (shortly after NOAA NCEI daily ~14:30 UTC release)
    - cron: "30 15 * * *"
    # ~06:00 Beijing Time (secondary catch-up if upstream was delayed)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-oisst:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest NOAA OISST v2.1 data
        run: python scripts/update_oisst.py

      - name: Commit and push updated data
        run: |
          if [[ -z "$(git status --porcelain data/ public/data/)" ]]; then
            echo "No data changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oisst_daily_sst.csv public/data/enso-daily.json
          git commit -m "chore(data): update NOAA OISST v2.1 daily ENSO data"
          git push
